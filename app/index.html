<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co">
  <title>Araç Filo Yönetimi</title>
  <link rel="icon" href="dizayn17-icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon.png" type="image/png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="dizayn17-logo.png" alt="Dizayn17" class="brand-logo">
        <div>
          <div class="brand-title" id="brandTitle">ARAÇ FİLO YÖNETİMİ</div>
          <div class="brand-sub" id="brandSub">Filo Yönetim Sistemi</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <button class="btn secondary small mobilemenu" id="menuBtn">☰ Menü</button>
          <b id="companyName">Filo Yönetim Sistemi</b><br>
          <small id="modeLabel"></small>
        </div>
        <div class="top-right">
          <div class="muted" id="clock"></div>
          <div class="user-tools">
            <button class="btn secondary small icon-btn" data-theme-toggle type="button" title="Koyu temaya geç" aria-label="Koyu temaya geç">🌙</button>
            <button class="btn secondary small" id="logoutBtn" hidden>Çıkış</button>
          </div>
          <img src="dardanel-logo.svg" alt="Dardanel" class="company-logo">
        </div>
      </header>
      <div class="content" id="view"></div>
      <footer class="footer"><span id="footer"></span><span class="made-by"><img src="dizayn17-icon.svg" alt="">Dizayn17</span></footer>
    </main>
  </div>
  <div id="modalroot"></div>
  <div class="login-screen" id="loginScreen" hidden>
    <button class="btn secondary small icon-btn login-theme" data-theme-toggle type="button" title="Koyu temaya geç" aria-label="Koyu temaya geç">🌙</button>
    <form class="login-card" id="loginForm" autocomplete="on">
      <img src="dardanel-logo.svg" alt="Dardanel" class="login-logo">
      <h1>Araç Filo Yönetimi</h1>
      <p>Devam etmek için kurumsal hesabınızla giriş yapın.</p>
      <label for="loginEmail">E-posta</label>
      <input id="loginEmail" type="email" autocomplete="username" required>
      <label for="loginPassword">Şifre</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
      <div class="login-error" id="loginError" role="alert"></div>
      <button class="btn" id="loginBtn" type="submit">Giriş Yap</button>
      <button class="linkbtn" id="forgotBtn" type="button">Şifremi unuttum</button>
      <div class="login-foot"><img src="dizayn17-logo.png" alt="Dizayn17"></div>
    </form>
  </div>
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="storage.js"></script>
  <script src="modules.js"></script>
  <script src="app.js"></script>
</body>
</html>
