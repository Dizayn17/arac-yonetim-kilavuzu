# Windows kurulum (.exe) ve taşınabilir sürümü derler.
# Çalıştırmak için: yeni bir etiket gönder (git tag v1.0.0 && git push --tags)
# veya Actions sekmesinden "Windows sürümü derle" > Run workflow.
name: Windows sürümü derle

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AracFiloYonetimi-Windows
          path: dist/*.exe
      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
