# Windows kurulum (.exe) ve taşınabilir sürümü derler.
# Çalıştırmak için: Actions > "Windows sürümü derle" > Run workflow (veya v* etiketi gönder).
# Release etiketi package.json içindeki version değerinden alınır.
name: Windows sürümü derle

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AracFiloYonetimi-Windows
          path: dist/*.exe
      - name: Sürüm numarasını oku
        id: ver
        shell: bash
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Release'e ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: Araç Filo Yönetimi ${{ steps.ver.outputs.v }}
          files: dist/*.exe
